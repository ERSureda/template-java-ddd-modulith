spring:
  application:
    name: ${SPRING_APPLICATION_NAME:template-api}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/plain,application/xml

outbox:
  poll-interval: ${OUTBOX_POLL_INTERVAL:1000}
  purge-cron: ${OUTBOX_PURGE_CRON:0 0 3 * * ?}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
