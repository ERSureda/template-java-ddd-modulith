plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.template'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll([
		'-parameters',
		'-Xlint:all',
		'-Xlint:-processing',
		'-Xlint:-serial'
	])
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', '1.4.0')
	set('awsSdkVersion', '2.30.36')
	set('testcontainersVersion', '1.20.5')
	set('archunitVersion', '1.4.1')
	set('bouncyCastleVersion', '1.80')
	set('mapstructVersion', '1.6.3')
	set('lombokMapstructBindingVersion', '0.2.0')
	set('springdocVersion', '2.8.5')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
		mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
	}
}

dependencies {
	// ==========================================
	// 1. Spring Boot Core, Web & Validation
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ==========================================
	// 2. Spring Modulith (Hexagonal Architecture)
	// ==========================================
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	implementation 'org.springframework.modulith:spring-modulith-events-api'
	implementation 'org.springframework.modulith:spring-modulith-api'

	// ==========================================
	// 3. Relational Persistence (PostgreSQL 17 + Flyway)
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.hibernate.orm:hibernate-spatial'
	runtimeOnly 'org.postgresql:postgresql'

	// ==========================================
	// 4. In-Memory & Real-Time Engine (AWS Valkey / Redis)
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// ==========================================
	// 5. AWS SDK v2 (DynamoDB, S3, KMS)
	// ==========================================
	implementation 'software.amazon.awssdk:dynamodb'
	implementation 'software.amazon.awssdk:dynamodb-enhanced'
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:kms'

	// ==========================================
	// 6. Security, Hashing & Utilities
	// ==========================================
	implementation "org.bouncycastle:bcprov-jdk18on:${bouncyCastleVersion}"

	// ==========================================
	// 7. Observability & Production Actuator
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-core'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// ==========================================
	// 8. Annotation Processors & Developer Tools
	// ==========================================
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// ==========================================
	// 8b. API Documentation (OpenAPI / Swagger)
	// ==========================================
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// ==========================================
	// 9. Testing, Modulith, Containers & ArchUnit
	// ==========================================
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:localstack'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}
